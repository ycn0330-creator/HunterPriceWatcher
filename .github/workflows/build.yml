name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HunterPriceWatcher_v0.2_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q -o HunterPriceWatcher_v0.2_source.zip

      - name: Build APK
        working-directory: HunterPriceWatcher_v0.2
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HunterPriceWatcher-v0.2-APK
          path: HunterPriceWatcher_v0.2/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
